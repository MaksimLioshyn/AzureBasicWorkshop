name: build-and-deploy-webapp-container

on:
  push:
    branches: [ "main" ]
    paths:
      - "WebApp/**"
      - ".github/workflows/container-cd.yml"

permissions:
  id-token: write
  contents: read

env:
  AZURE_WEBAPP_NAME: "<web-app-name>"
  ACR_NAME: "<acr-name>"
  IMAGE_NAME: "webapp"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Build and push image to ACR
        run: |
          az acr login --name "$ACR_NAME"
          docker build -t "$ACR_NAME.azurecr.io/$IMAGE_NAME:${{ github.sha }}" ./WebApp
          docker push "$ACR_NAME.azurecr.io/$IMAGE_NAME:${{ github.sha }}"

      - name: Update Web App container image
        run: |
          az webapp config container set \
            --name "$AZURE_WEBAPP_NAME" \
            --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
            --container-image-name "$ACR_NAME.azurecr.io/$IMAGE_NAME:${{ github.sha }}"
